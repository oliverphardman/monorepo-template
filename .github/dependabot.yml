# Uncomment where relevant for different apps and frameworks

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]

